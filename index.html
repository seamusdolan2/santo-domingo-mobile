  <style>
    /* ============================================================
       ALL CSS SCOPED TO: body.fl718-santo-domingo-page
       Every rule uses this body class as scope prefix.
       Never write unscoped rules — they bleed into other pages.
       ============================================================ */

    /* ------------------------------------------------------------
       BASE RESET & BODY
       ------------------------------------------------------------ */
    body.fl718-santo-domingo-page {
      margin: 0;
      padding: 0;
      /* overflow-x: clip — NOT hidden.
         overflow-x: hidden creates a new scroll container that breaks
         position:sticky and ScrollTrigger pins. clip clips visually
         without that side effect. Never use overflow-x:hidden on body
         or html on this project. */
      overflow-x: clip;
      background-color: #f5f3ef;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    /* Box-sizing via :where() — zero specificity, never fights other rules */
    :where(body.fl718-santo-domingo-page) *,
    :where(body.fl718-santo-domingo-page) *::before,
    :where(body.fl718-santo-domingo-page) *::after {
      box-sizing: border-box;
    }

    body.fl718-santo-domingo-page img {
      max-width: 100%;
      display: block;
    }

    /* ------------------------------------------------------------
       VISUALLY HIDDEN — accessible text, not visible on screen.
       ------------------------------------------------------------ */
    body.fl718-santo-domingo-page .fl718-sd-visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ============================================================
       HERO SECTION
       height: 100vh — fills the viewport on load.
       The hero photograph is landscape, interior/exterior subject.
       Background color is pre-load placeholder: warm muted concrete.

       ANIMATION: "Two Planes" — two clipped copies of the photograph
       slide in from opposite sides, sealing at the window frame line.
       ============================================================ */

    body.fl718-santo-domingo-page .fl718-sd-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: clip;
      background-color: #e8e4de;
    }

    /* ============================================================
       HERO — TWO PLANES ANIMATION ("Two Planes")
       Two absolutely-positioned copies of the same photograph,
       each clipped to one half of the frame. Left: interior world
       (room, painting, curtains) — enters from the left. Right:
       exterior world (window, city, Caribbean light) — enters from
       the right. They seal at the window frame line. You have seen
       the seam.
       ============================================================ */

    body.fl718-santo-domingo-page .fl718-sd-hero__img-left,
    body.fl718-santo-domingo-page .fl718-sd-hero__img-right {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      opacity: 0;
    }

    /* Left half: the interior — room, curtains, the tourist painting. */
    body.fl718-santo-domingo-page .fl718-sd-hero__img-left {
      clip-path: inset(0 50% 0 0);
    }

    /* Right half: the exterior — window, sky, city, harsh Caribbean light. */
    body.fl718-santo-domingo-page .fl718-sd-hero__img-right {
      clip-path: inset(0 0 0 50%);
    }

    /* The seam — a 1px vertical rule at 50% that names the threshold
       between the two worlds, appears briefly then dissolves. */
    body.fl718-santo-domingo-page .fl718-sd-hero__seam {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.55);
      transform: translateX(-50%);
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    /* Title block — bottom gradient + text container.
       Starts at opacity:0 so the gradient doesn't sit over the photograph
       during the Two Planes reveal. Fades in just before the eyebrow arrives.
       Individual text elements then animate in sequence (eyebrow → city → sub). */
    body.fl718-santo-domingo-page .fl718-sd-hero__title-block {
      position: absolute;
      inset: auto 0 0 0;
      padding: 80px 48px 44px;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.58) 0%,
        rgba(0, 0, 0, 0.22) 55%,
        rgba(0, 0, 0, 0) 100%
      );
      z-index: 10;
      opacity: 0;
      pointer-events: none;
    }

    /* Eyebrow — "Dominican Republic" — Playfair Display 400 uppercase, letter-spaced */
    body.fl718-santo-domingo-page .fl718-sd-hero__eyebrow {
      display: block;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(11px, 0.9vw, 12px);
      font-weight: 400;
      font-style: normal;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: clamp(6px, 0.7vw, 10px);
      opacity: 0;
    }

    /* City title — "Santo Domingo" — Playfair Display 900 italic: Colonial Weight */
    body.fl718-santo-domingo-page .fl718-sd-hero__city {
      display: block;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(32px, 4.5vw, 68px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.02em;
      line-height: 0.92;
      color: #ffffff;
      margin-top: clamp(6px, 0.8vw, 10px);
      opacity: 0;
    }

    /* Sub — "La Capital · 2023" — Lora 300 italic: the whisper after the stone */
    body.fl718-santo-domingo-page .fl718-sd-hero__sub {
      display: block;
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(11px, 1.1vw, 15px);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.52);
      margin-top: clamp(12px, 1.4vw, 18px);
      opacity: 0;
    }

    /* Caption — inline continuation of the sub line */
    body.fl718-santo-domingo-page .fl718-sd-hero__caption {
      display: inline;
    }

    /* Reduced motion: reveal all hero elements immediately at their final state.
       Also covers .fl718-sd-hero__title-block (gradient) which starts at opacity:0. */
    @media (prefers-reduced-motion: reduce) {
      body.fl718-santo-domingo-page .fl718-sd-hero__title-block,
      body.fl718-santo-domingo-page .fl718-sd-hero__eyebrow,
      body.fl718-santo-domingo-page .fl718-sd-hero__city,
      body.fl718-santo-domingo-page .fl718-sd-hero__sub {
        opacity: 1 !important;
        transform: none !important;
      }
    }

    /* ============================================================
       GALLERY GRID — 3-column masonry layout
       CSS columns masonry — NOT CSS Grid.
       CSS Grid causes dead vertical space with mixed-height photos.
       column-count: 3 desktop / 2 tablet / 1 mobile.
       Each item: break-inside: avoid; margin-bottom: 8px.
       ============================================================ */

    body.fl718-santo-domingo-page .fl718-sd-grid {
      /* column-count masonry: no max-width constraint — photo city
         pages benefit from full-width breathing room. */
      columns: 3;
      column-gap: 8px;
      padding: 8px;
      padding-top: 14vh;
      padding-bottom: 12vh;
    }

    @media (max-width: 768px) {
      body.fl718-santo-domingo-page .fl718-sd-grid {
        columns: 2;
        padding-top: 10vh;
      }
    }

    @media (max-width: 480px) {
      body.fl718-santo-domingo-page .fl718-sd-grid {
        columns: 1;
        padding: 8px;
        padding-top: 8vh;
        padding-bottom: 8vh;
      }
    }

    /* ------------------------------------------------------------
       GALLERY ITEMS — shared base
       break-inside: avoid — prevents masonry column breaks mid-image.
       margin: 0 to override browser UA margin on <figure>.
       overflow: clip required — clip-path on img must not overflow column.
       opacity NOT set here — Rain Curtain hides via clip-path on img,
       not opacity on figure. Setting both creates double-invisible flicker.
       ------------------------------------------------------------ */

    body.fl718-santo-domingo-page .fl718-sd-item {
      break-inside: avoid;
      margin: 0 0 8px 0;
      overflow: clip;
      cursor: pointer;
      position: relative;
      display: block;
    }

    /* "The Rain Curtain" — starting state on img.
       clip-path: inset(0 0 100% 0) = fully clipped from below, hidden.
       As bottom inset → 0%, photo reveals top-to-bottom (sky first, then street).
       filter: blur(2px) dissipates as the curtain lifts.
       No opacity: 0 — clip-path handles visibility. */
    body.fl718-santo-domingo-page .fl718-sd-item img {
      width: 100%;
      height: auto;
      display: block;
      clip-path: inset(0 0 100% 0);
      filter: blur(2px);
    }

    /* ============================================================
       HOVER EFFECT — PLACEHOLDER
       TBD in prototyping. The set has strong geometric shadows —
       a hover that plays with contrast or light is the direction.
       Placeholder: a subtle dark veil fades in on hover.
       Replace with the page-specific hover technique.

       ANIMATION HOOK: HOVER EFFECT TBD — see JS sfWarmInit pattern
       from Santa Fe for architecture reference. City version should
       be distinct: consider CSS filter contrast shift, or a geometric
       veil that reinforces the shadow character of the set.
       ============================================================ */

    /* ============================================================
       HOVER EFFECT — "The Window Frame"

       The interior/exterior threshold from the hero repeats as hover
       vocabulary. A radial-gradient vignette darkens the edges while
       preserving a clear center aperture — a window frame pressed
       inward from all sides. Not a flat veil: the center holds clear.

       The gradient is baked into CSS (GSAP cannot tween gradient
       strings). GSAP tweens opacity only: 0 → 1 on enter, 1 → 0 on
       leave. The warm-dark tone (not cold black) stays in the city's
       concrete palette.

       On enter: 0 → 1, 0.5s, power2.out. The frame closes in.
       On leave: 1 → 0, 0.65s, power2.inOut. Steps back gently.
       ============================================================ */

    body.fl718-santo-domingo-page .fl718-sd-item__veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      will-change: opacity;

      /* Radial vignette — window frame from all edges.
         Center clear, edges dark. The aperture of looking through glass.
         62% × 58% ellipse: slightly wider than tall, window proportion. */
      background: radial-gradient(
        ellipse 62% 58% at 50% 50%,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0) 35%,
        rgba(6, 4, 2, 0.28) 62%,
        rgba(8, 6, 3, 0.68) 100%
      );
    }

    @media (prefers-reduced-motion: reduce) {
      body.fl718-santo-domingo-page .fl718-sd-item__veil {
        display: none !important;
      }
      body.fl718-santo-domingo-page .fl718-sd-item img {
        clip-path: none !important;
        filter: none !important;
      }
    }

    /* ============================================================
       LIGHTBOX — "The Glass Pane" (page-specific)
       Three fixed-position layers (z-ordered):
         9000: .fl718-sd-lb-dark  — venetian-strip container; strips
                                    are JS-built children that scaleY-seal
                                    top-to-bottom on open (rain shutters
                                    closing) and peel bottom-to-top on
                                    close (light returning).
         9100: .fl718-sd-lb-stage — photograph centered; the wrap slides
                                    in from the right on open and out
                                    again on close. Horizontal slide for
                                    prev/next nav too.
         9200: .fl718-sd-lb-ui   — close, nav, counter

       The lightbox extends the page's "looking through things" register:
       hero is two worlds sealing at a window line, grid reveal is rain
       lifting, hover is a window frame pressed inward. The lightbox
       seals like rain shutters and slides the photograph through a frame.

       SAFARI: no clip-path + GSAP filter on the photo element. Strips
       use scaleY only; photo wrap uses x + opacity only. Dark layer
       has overflow: clip so strip overflow can never bleed.
    ============================================================ */

    /* Layer 1: Dark — strip container.
       Starts at opacity:0; on open we set opacity:1 BEFORE strips animate
       so the strips become visible as they scaleY in. The dark layer
       background is transparent — the strips themselves carry the warm
       dark color. This way the dark only exists where strips have sealed. */
    body.fl718-santo-domingo-page .fl718-sd-lb-dark {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: transparent;
      pointer-events: none;
      opacity: 0;
      /* overflow: clip so strip transforms can never overflow the viewport
         (unlike overflow:hidden, clip does not create a new scroll container
         and does not break position:sticky elsewhere). */
      overflow: clip;
    }

    body.fl718-santo-domingo-page .fl718-sd-lb-dark--active {
      pointer-events: auto;
    }

    /* Venetian strips — JS-built children of .fl718-sd-lb-dark.
       Each strip is a horizontal band: width 100%, height = 100% / strip count.
       Starting state: scaleY(0) from transform-origin: top center — collapsed
       at the top edge, invisible. On open: each strip scaleY 0→1 staggered
       top→bottom (rain shutters closing). On close: scaleY 1→0 from
       transform-origin: bottom center, staggered bottom→top (light returning).
       Color is the warm dark concrete of this page — never flat black. */
    body.fl718-santo-domingo-page .fl718-sd-lb-strip {
      position: absolute;
      left: 0;
      width: 100%;
      /* height + top set inline by JS as 100% / SD_STRIP_COUNT */
      background: rgba(14, 10, 6, 0.97);
      transform: scaleY(0);
      transform-origin: top center;
    }

    /* Layer 2: Stage — positioning layer only. Always opaque; the
       photo wrap inside carries the slide-in animation (opacity + x). */
    body.fl718-santo-domingo-page .fl718-sd-lb-stage {
      position: fixed;
      inset: 0;
      z-index: 9100;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    body.fl718-santo-domingo-page .fl718-sd-lb-stage--active {
      pointer-events: auto;
    }

    /* Photo wrap — the GSAP slide target.
       Starts at opacity:0, x:80 (set by JS). On open: x → 0, opacity → 1
       (photo slides in from the right, like a print being placed in a frame).
       On close: x → 80, opacity → 0. On nav: exits one direction, re-enters
       from the opposite side. */
    body.fl718-santo-domingo-page .fl718-sd-lb-image-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: calc(100vw - 120px);
      max-height: calc(100dvh - 120px);
      opacity: 0;
    }

    body.fl718-santo-domingo-page .fl718-sd-lb-image {
      max-width: 100%;
      max-height: calc(100dvh - 120px);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      /* No will-change on the image — the wrap is the transform target.
         No CSS filter on the photo (Safari black-flash trap with GSAP). */
    }

    /* Backdrop — full-layer click-to-close region.
       Sibling of the image-wrap (NOT a child) so the wrap can transform
       independently. Sits behind the wrap; the wrap captures clicks on
       the photograph itself, the backdrop captures clicks anywhere else. */
    body.fl718-santo-domingo-page .fl718-sd-lb-backdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      cursor: default;
    }

    /* Layer 3: UI */
    body.fl718-santo-domingo-page .fl718-sd-lb-ui {
      position: fixed;
      inset: 0;
      z-index: 9200;
      pointer-events: none;
      opacity: 0;
    }

    body.fl718-santo-domingo-page .fl718-sd-lb-ui--active {
      pointer-events: auto;
    }

    /* Close button */
    body.fl718-santo-domingo-page .fl718-sd-lb-close-btn {
      position: absolute;
      top: clamp(1rem, 2vh, 1.6rem);
      right: clamp(1rem, 2vw, 1.6rem);
      width: 44px;
      height: 44px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: rgba(248, 244, 236, 0.75);
    }

    body.fl718-santo-domingo-page .fl718-sd-lb-close-btn:hover {
      color: rgba(248, 244, 236, 1);
    }

    body.fl718-santo-domingo-page .fl718-sd-lb-close-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.2;
      stroke-linecap: round;

    /* Counter */
    body.fl718-santo-domingo-page .fl718-sd-lb-counter {

      font-size: 0.80rem;

      letter-spacing: 0.16em;

    }

    /* Prev/next nav */
    body.fl718-santo-domingo-page .fl718-sd-lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;

    body.fl718-santo-domingo-page .fl718-sd-lb-nav:hover {

    /* Nav arrows hidden at the ends — wrap-around is on, so this is currently

    body.fl718-santo-domingo-page .fl718-sd-lb-nav.fl718-sd-lb-nav--hidden {
      opacity: 0;
      pointer-events: none;

      function sdAfterWeightedSample(pool, activeName, count) {

        var eligible = pool.filter(function (c) {
          return c.name !== activeName;

        /* Expand by weight */

        } else if (isComingSoon) {
          card.className += ' fl718-ws-city--upcoming fl718-ws-city--coming-soon';
        } else {
          card.className += ' fl718-ws-city--linked fl718-ws-city--upcoming';
          card.setAttribute('href', city.href);
          card.setAttribute('aria-label', city.name + ' photographs');
          /* data-coords powers the GPS scramble on tap */
          if (city.coords) {
            card.setAttribute('data-coords', city.coords);
          }
        }

        /* Photo wrap */
        var wrap = document.createElement('div');
        wrap.className = 'fl718-ws-city__photo-wrap';

        var img = document.createElement('img');
        img.className = 'fl718-ws-city__photo';
        img.src = city.photo;
        img.alt = city.alt;
        img.setAttribute('loading', isActive ? 'eager' : 'lazy');
        img.setAttribute('decoding', 'async');
        wrap.appendChild(img);

        /* Camera flash overlay — used by Static Burst link-out */
        var flash = document.createElement('div');
        flash.className = 'fl718-ws-city__flash';
        flash.setAttribute('aria-hidden', 'true');
        wrap.appendChild(flash);

        /* GPS coordinate ping — scramble-reveal on tap, inside photo */
        var ping = document.createElement('div');
        ping.className = 'fl718-ws-city__ping';
        ping.setAttribute('aria-hidden', 'true');
        wrap.appendChild(ping);

        /* Coming-soon overlay */
        if (isComingSoon) {
          var overlay = document.createElement('div');
          overlay.className = 'fl718-ws-city__overlay';
          overlay.textContent = 'Coming Soon';
          wrap.appendChild(overlay);
        }

        card.appendChild(wrap);

        /* Name */
        var name = document.createElement('div');
        name.className = 'fl718-ws-city__name';
        name.textContent = city.name;
        card.appendChild(name);

        /* Region */
        var region = document.createElement('div');
        region.className = 'fl718-ws-city__region';
        region.textContent = city.region;
        card.appendChild(region);

        return card;
      }

      /* ═══════════════════════════════════════════════════════════
         ANIMATION
         ═══════════════════════════════════════════════════════════ */

      var sdAfterReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function sdAfterInit() {
        var section = document.getElementById('fl718IntlAfter');
        if (!section) return;

        /* Build the strip first, then animate whatever is in it */
        sdAfterBuildStrip();

        if (sdAfterReducedMotion) return;

        gsap.registerPlugin(ScrollTrigger);

        var sdAfterDateline   = document.getElementById('fl718Dateline');
        var sdAfterRule       = document.getElementById('fl718Rule');
        var sdAfterEyebrow    = document.getElementById('fl718Eyebrow');
        var sdAfterCities     = Array.prototype.slice.call(section.querySelectorAll('.fl718-ws-city'));
        var sdAfterBottomRule = document.getElementById('fl718BottomRule');
        var sdAfterTaxonomy   = document.getElementById('fl718Taxonomy');

        /* GSAP must own the y state — CSS transform: translateY() is
           invisible to GSAP's internal cache. Set via gsap.set so the
           y: 0 tween in Beat 4 actually travels. */
        if (sdAfterCities.length > 0) {
          gsap.set(sdAfterCities, { opacity: 0, y: 16 });
        }

        var tl = gsap.timeline({
          scrollTrigger: {
            trigger: section,
            start: 'top 82%',
            once: true
          }
        });

        /* Beat 1 — dateline: letter-by-letter reveal, group by group */
        function sdAfterSplitChars(el) {
          var text = el.textContent;
          el.textContent = '';
          var spans = [];
          for (var i = 0; i < text.length; i++) {
            var s = document.createElement('span');
            s.textContent = text[i] === ' ' ? '\u00a0' : text[i];
            s.style.display = 'inline-block';
            s.style.opacity = '0';
            s.style.transform = 'translateY(6px)';
            el.appendChild(s);
            spans.push(s);
          }
          return spans;
        }

        var sdAfterCityEl   = sdAfterDateline.querySelector('.fl718-intl-after__city');
        var sdAfterCoordsEl = sdAfterDateline.querySelector('.fl718-intl-after__coords');
        var sdAfterYearEl   = sdAfterDateline.querySelector('.fl718-intl-after__year');
        var sdAfterSeps     = sdAfterDateline.querySelectorAll('.fl718-intl-after__sep');
        var sdAfterSep1     = sdAfterSeps[0];
        var sdAfterSep2     = sdAfterSeps[1];

        /* Make dateline container visible — children start hidden */
        gsap.set(sdAfterDateline, { opacity: 1, y: 0 });

        /* Hide seps until their group arrives */
        if (sdAfterSep1) gsap.set(sdAfterSep1, { opacity: 0 });
        if (sdAfterSep2) gsap.set(sdAfterSep2, { opacity: 0 });

        var sdAfterCityChars  = sdAfterSplitChars(sdAfterCityEl);
        var sdAfterCoordChars = sdAfterSplitChars(sdAfterCoordsEl);
        var sdAfterYearChars  = sdAfterSplitChars(sdAfterYearEl);

        var sdAfterCharDefaults = { opacity: 1, y: 0, ease: 'power2.out', duration: 0.03 };

        /* City name types out */
        tl.to(sdAfterCityChars, Object.assign({}, sdAfterCharDefaults, { stagger: 0.045 }), 0);

        /* Sep 1 appears */
        tl.to(sdAfterSep1, { opacity: 1, duration: 0.2 }, '-=0.1');

        /* Coords type out */
        tl.to(sdAfterCoordChars, Object.assign({}, sdAfterCharDefaults, { stagger: 0.032 }), '-=0.05');

        /* Sep 2 appears */
        tl.to(sdAfterSep2, { opacity: 1, duration: 0.2 }, '-=0.1');

        /* Year types out */
        tl.to(sdAfterYearChars, Object.assign({}, sdAfterCharDefaults, { stagger: 0.06 }), '-=0.05');

        /* Beat 2 — rule draws left to right */
        tl.to(sdAfterRule, { scaleX: 1, duration: 0.65, ease: 'power2.inOut' }, '-=0.1');

        /* Beat 3 — eyebrow */
        tl.to(sdAfterEyebrow, { opacity: 1, duration: 0.45, ease: 'power1.out' }, 1.0);

        /* Beat 4 — cities stagger up */
        tl.to(sdAfterCities, { opacity: 1, y: 0, duration: 0.55, stagger: 0.09, ease: 'power2.out' }, 1.15);

        /* Beat 5 — bottom rule fades, then taxonomy terms type out word by word */
        tl.to(sdAfterBottomRule, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 1.75);

        /* Make taxonomy container visible; seps start hidden */
        gsap.set(sdAfterTaxonomy, { opacity: 1 });
        var sdAfterTaxLinks = Array.prototype.slice.call(sdAfterTaxonomy.querySelectorAll('.fl718-intl-after__tax-link'));
        var sdAfterTaxSeps  = Array.prototype.slice.call(sdAfterTaxonomy.querySelectorAll('.fl718-intl-after__tax-sep'));
        sdAfterTaxSeps.forEach(function(s) { gsap.set(s, { opacity: 0 }); });

        /* Split each term and stagger chars across all terms sequentially */
        var sdAfterTaxOffset = 1.9;
        sdAfterTaxLinks.forEach(function(link, i) {
          var chars = sdAfterSplitChars(link);
          tl.to(chars, { opacity: 1, y: 0, ease: 'power2.out', duration: 0.025, stagger: 0.04 }, sdAfterTaxOffset);
          sdAfterTaxOffset += chars.length * 0.04 + 0.02;
          /* Sep appears after each term except the last */
          if (sdAfterTaxSeps[i]) {
            tl.to(sdAfterTaxSeps[i], { opacity: 1, duration: 0.15 }, sdAfterTaxOffset);
            sdAfterTaxOffset += 0.1;
          }
        });

        /* Refresh after all tweens are built — grid images above may
           shift layout after lazy-load, affecting trigger positions. */
        ScrollTrigger.refresh();

        /* ── DEPTH-OF-FIELD SCROLL EFFECT ─────────────────────────
           Cards nearest the strip center are brightest/most saturated.
           Edge cards recede. Recalculated live on horizontal scroll.
        ──────────────────────────────────────────────────────────── */
        var sdAfterStrip    = document.getElementById('fl718Strip');
        var sdAfterWipeBar  = document.getElementById('sdWipeBar'); /* cached once */
        var sdAfterDOFCards = Array.prototype.slice.call(
          section.querySelectorAll('.fl718-ws-city--linked')
        );

        var DOF_CENTER_OP  = 0.95;
        var DOF_EDGE_OP    = 0.52;
        var DOF_CENTER_SAT = 0.9;
        var DOF_EDGE_SAT   = 0.28;
        var DOF_CENTER_TXT = 1.0;
        var DOF_EDGE_TXT   = 0.55;

        function sdAfterLerp(a, b, t) { return a + (b - a) * t; }

        /* Cache per-card DOM references and set initial DOF state */
        if (sdAfterDOFCards.length > 0) {
          sdAfterDOFCards.forEach(function(card) {
            card._sdPhoto  = card.querySelector('.fl718-ws-city__photo');
            card._sdNameEl = card.querySelector('.fl718-ws-city__name');
            card._sdFlash  = card.querySelector('.fl718-ws-city__flash');
            card._sdPing   = card.querySelector('.fl718-ws-city__ping');
            gsap.set(card._sdPhoto,  { opacity: DOF_EDGE_OP,  filter: 'saturate(' + DOF_EDGE_SAT + ')' });
            gsap.set(card._sdNameEl, { opacity: DOF_EDGE_TXT });
          });
        }

        function sdAfterUpdateDOF() {
          if (!sdAfterStrip || sdAfterDOFCards.length === 0) return;
          var stripRect   = sdAfterStrip.getBoundingClientRect();
          /* Focus on the snapped card's center, not the strip's visual midpoint.
             The snapped card's left edge sits at (stripRect.left + 24px padding),
             so its center is always at stripRect.left + 24 + 77 (half of 155px). */
          var stripCenter = stripRect.left + 24 + 77;

          sdAfterDOFCards.forEach(function(card) {
            var cardRect   = card.getBoundingClientRect();
            var cardCenter = cardRect.left + cardRect.width * 0.5;
            var dist       = Math.abs(cardCenter - stripCenter);
            var norm       = Math.min(dist / (cardRect.width * 1.2), 1);

            var targetOp  = sdAfterLerp(DOF_CENTER_OP,  DOF_EDGE_OP,  norm);
            var targetSat = sdAfterLerp(DOF_CENTER_SAT, DOF_EDGE_SAT, norm);
            var targetTxt = sdAfterLerp(DOF_CENTER_TXT, DOF_EDGE_TXT, norm);

            /* Use cached references — no querySelector per frame */
            gsap.to(card._sdPhoto, {
              opacity: targetOp,
              filter: 'saturate(' + targetSat.toFixed(3) + ')',
              duration: 0.25,
              ease: 'power1.out',
              overwrite: 'auto'
            });
            gsap.to(card._sdNameEl, {
              opacity: targetTxt,
              duration: 0.25,
              ease: 'power1.out',
              overwrite: 'auto'
            });
          });
        }

        /* Run once on load to seed center-card state, then listen for strip scroll */
        sdAfterUpdateDOF();

        var sdAfterDOFPending = false;
        if (sdAfterStrip) {
          sdAfterStrip.addEventListener('scroll', function() {
            if (!sdAfterDOFPending) {
              sdAfterDOFPending = true;
              requestAnimationFrame(function() {
                sdAfterUpdateDOF();
                sdAfterDOFPending = false;
              });
            }
          }, { passive: true });
        }

        /* ── SCRAMBLE TAP + STATIC BURST LINK-OUT ─────────────────
           Tap a linked city card:
             1. GPS coordinates scramble-resolve over the photo
             2. 600ms hold
             3. Coords chars explode outward (Static Burst)
                — burst chars are z-index 200; wipe bar is z-index 9999.
                  Chars are intentionally overtaken by the wipe as it sweeps,
                  creating a "signal swallowed by darkness" effect.
             4. Camera flash on the photo
             5. Dark wipe bar sweeps left→right across viewport
             6. Navigate to city page (or reset for placeholder #hrefs)
           prefers-reduced-motion: navigate immediately, no animation.
        ──────────────────────────────────────────────────────────── */
        var SCRAMBLE_CHARS     = '0123456789ABCDEF°′″NSEW+-.·×∑Δ≈§';
        var TAP_THRESHOLD      = 8;    /* px — distinguishes tap from scroll gesture */
        var sdAfterCurrentScramble = null; /* IIFE-scoped handle, cancellable */
        var sdAfterBurstTl     = null; /* IIFE-scoped burst timeline, killable */

        function sdAfterRandChar() {
          return SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
        }

        /* Scramble text into finalText, resolving left-to-right.
           Returns { stop } so the caller can cancel mid-flight.
           Note: resolveId is overwritten on each recursive call. The
           stopped flag guard in resolveNext safely handles any late-firing
           timers after stop() is called. */
        function sdAfterScramble(el, finalText, onComplete) {
          var chars      = finalText.split('');
          var resolved   = [];
          var resolveIdx = 0;
          var intervalId, resolveId;
          var stopped    = false;

          function updateDisplay() {
            var out = '';
            for (var i = 0; i < chars.length; i++) {
              if (i < resolveIdx) {
                out += resolved[i];
              } else {
                out += (chars[i] === ' ' || chars[i] === '′' || chars[i] === '°')
                  ? chars[i] : sdAfterRandChar();
              }
            }
            el.textContent = out;
          }

          function resolveNext() {
            if (stopped) return;
            if (resolveIdx < chars.length) {
              resolved[resolveIdx] = chars[resolveIdx];
              resolveIdx++;
              resolveId = setTimeout(resolveNext, 80);
            } else {
              clearInterval(intervalId);
              el.textContent = finalText;
              if (onComplete) onComplete();
            }
          }

          intervalId = setInterval(updateDisplay, 40);
          resolveId  = setTimeout(resolveNext, 120);

          return {
            stop: function() {
              stopped = true;
              clearInterval(intervalId);
              clearTimeout(resolveId);
            }
          };
        }

        /* Reset a card fully after burst completes without navigation
           (placeholder #href case — allows re-tap). */
        function sdAfterResetCard(card) {
          card._sdActive = false;
          gsap.set(card._sdPing,  { opacity: 0 });
          gsap.set(card._sdFlash, { opacity: 0 });
          card._sdPing.textContent = '';
          if (sdAfterWipeBar) {
            gsap.set(sdAfterWipeBar, { x: '-100%', pointerEvents: 'none' });
          }
        }

        /* Static Burst link-out animation.
           Uses IIFE-scoped sdAfterBurstTl so it can be killed externally. */
        function sdAfterStaticBurst(card, coordsText, href) {
          var ping     = card._sdPing;
          var flash    = card._sdFlash;
          var pingRect = ping.getBoundingClientRect();
          var burstEls = [];

          /* Spawn fixed-position char spans at ping location.
             position:fixed + getBoundingClientRect coords escape all
             overflow clipping from scroll containers. */
          coordsText.split('').forEach(function(ch, i) {
            var span = document.createElement('div');
            span.className     = 'fl718-sd-burst-char';
            span.textContent   = ch;
            span.style.left    = (pingRect.left + i * 6.2) + 'px';
            span.style.top     = pingRect.top + 'px';
            span.style.opacity = '0';
            document.body.appendChild(span);
            burstEls.push(span);
          });

          if (sdAfterBurstTl) sdAfterBurstTl.kill();

          sdAfterBurstTl = gsap.timeline({
            onComplete: function() {
              burstEls.forEach(function(s) {
                if (s.parentNode) s.parentNode.removeChild(s);
              });
              if (href && href !== '#') {
                window.location.href = href;
              } else {
                /* Placeholder href — reset so card can be tapped again */
                sdAfterResetCard(card);
              }
            }
          });

          /* 1. Chars appear then explode outward (0.5s).
                Wipe bar overtakes them intentionally at t=0.18 —
                chars are "swallowed by darkness" as the gate closes. */
          sdAfterBurstTl.set(burstEls, { opacity: 1 }, 0);
          burstEls.forEach(function(span, i) {
            var sx = (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 45);
            var sy = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 45);
            sdAfterBurstTl.to(span, {
              x: sx, y: sy, opacity: 0,
              duration: 0.5, ease: 'power2.in', delay: i * 0.018
            }, 0);
          });

          /* 2. Camera flash */
          sdAfterBurstTl.set(flash, { opacity: 0.92 }, 0.04);
          sdAfterBurstTl.to(flash, { opacity: 0, duration: 0.14, ease: 'power2.out' }, 0.04);

          /* 3. Wipe bar sweeps left→right */
          sdAfterBurstTl.set(sdAfterWipeBar, { x: '-100%', pointerEvents: 'all' }, 0.05);
          sdAfterBurstTl.to(sdAfterWipeBar, { x: '0%', duration: 0.4, ease: 'power2.inOut' }, 0.18);
        }

        /* Attach tap listeners to all linked city cards */
        sdAfterDOFCards.forEach(function(card) {
          card._sdActive = false;
          var tapX = 0, tapY = 0;

          card.addEventListener('touchstart', function(e) {
            tapX = e.touches[0].clientX;
            tapY = e.touches[0].clientY;
          }, { passive: true });

          card.addEventListener('touchend', function(e) {
            if (card._sdActive) return;
            var dx = Math.abs(e.changedTouches[0].clientX - tapX);
            var dy = Math.abs(e.changedTouches[0].clientY - tapY);
            if (dx > TAP_THRESHOLD || dy > TAP_THRESHOLD) return;
            e.preventDefault();
            sdAfterHandleTap(card);
          }, { passive: false });

          /* Desktop mouse fallback */
          card.addEventListener('click', function(e) {
            e.preventDefault();
            if (card._sdActive) return;
            sdAfterHandleTap(card);
          });
        });

        function sdAfterHandleTap(card) {
          card._sdActive = true;

          var coords = card.getAttribute('data-coords') || '';
          var href   = card.getAttribute('href') || '#';
          var ping   = card._sdPing;

          if (sdAfterReducedMotion) {
            if (href && href !== '#') window.location.href = href;
            card._sdActive = false;
            return;
          }

          /* Stop any in-flight scramble from a previous tap */
          if (sdAfterCurrentScramble) {
            sdAfterCurrentScramble.stop();
            sdAfterCurrentScramble = null;
          }

          gsap.set(ping, { opacity: 1 });
          ping.textContent = '';

          sdAfterCurrentScramble = sdAfterScramble(ping, coords, function() {
            sdAfterCurrentScramble = null;
            /* Coords locked — hold 600ms then fade and fire burst */
            setTimeout(function() {
              gsap.to(ping, {
                opacity: 0,
                duration: 0.35,
                ease: 'power1.in',
                onComplete: function() {
                  sdAfterStaticBurst(card, coords, href);
                }
              });
            }, 600);
          });
        }
      }

      if (document.readyState === 'complete') {
        sdAfterInit();
      } else {
        window.addEventListener('load', sdAfterInit);
      }

    })();
  </script>


  <!-- ============================================================
       THREE-ACT COORDINATION (MOBILE)
       Shared state between hero IIFE and grid IIFE. On mobile
       (1-column layout), the first grid items may be within the
       viewport during the hero animation. The grid waits for the
       hero to complete before revealing in-viewport items.
       Failsafe: if hero never completes (image decode failure),
       release the grid after 4.5s so content is never locked.
  ============================================================ -->
  <script>
    var sdHeroComplete = false;
    var sdPendingGridReveal = null;

    setTimeout(function() {
      if (!sdHeroComplete) {
        sdHeroComplete = true;
        if (sdPendingGridReveal) sdPendingGridReveal();
      }
    }, 4500);
  </script>


  <!-- ============================================================
       MAIN SCRIPT — Hero + Grid + Lightbox
       Single IIFE at bottom of <body>.
       Uses var (not let/const) — safe for WordPress inline injection.
       Scoped reduced-motion variable: sdReducedMotion.

       ARCHITECTURE:
         1. Hero entrance — "Two Planes": two clipped image halves
            slide in from opposite sides, sealing at the window frame.
            Decode guard (Promise.all) prevents black-flash on GPU layers.
         2. Grid image reveal — per-item IntersectionObserver,
            opacity fade placeholder. GRID ENTRANCE ANIMATION TBD.
         3. Lightbox — White Room → Dark fade. Open/close via
            opacity tween. No film badge (all digital).
  ============================================================ -->
  <script>
    (function() {
      'use strict';

      var sdReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var sdHoverCapable  = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      document.body.classList.add('fl718-js-loaded');

      // ----------------------------------------------------------
      // HERO ENTRANCE
      //
      // HERO ENTRANCE — "Two Planes" (see comment block above for full description)
      //
      // This photograph: dim interior foreground + curtains +
      // framed beach painting (the tourist fantasy) + through the
      // window: the city, clouds, sun breaking through.
      // The interior-to-exterior threshold is the whole argument.
      //
      // PLACEHOLDER: simple opacity fade-in over 1.4s.
      //   Phase 1 (0.0s – 1.4s): image fades in
      //   Phase 2 (1.2s – 1.8s): gradient fades in for text legibility
      //   Phase 3 (1.5s – 2.1s): title materializes
      //   Phase 4 (2.0s – 2.4s): subtitle whispers in
      //
      // Replace this block entirely when the final technique is built.
      // Keep the initSdHero pattern (image.complete check + load event).
      // ----------------------------------------------------------

      // Hoist all hero element references above the if/else — avoids duplicate var declarations
      var sdHeroImgLeft    = document.getElementById('sdHeroImgLeft');
      var sdHeroImgRight   = document.getElementById('sdHeroImgRight');
      var sdHeroSeam       = document.getElementById('sdHeroSeam');
      var sdHeroTitleBlock = document.getElementById('sdHeroTitleBlock');
      var sdHeroEyebrow    = document.getElementById('sdHeroEyebrow');
      var sdHeroCity       = document.getElementById('sdHeroCity');
      var sdHeroSub        = document.getElementById('sdHeroSub');

      if (!sdReducedMotion) {

        // ----------------------------------------------------------
        // HERO ENTRANCE — "Two Planes" + Colonial Weight typography
        //
        // Two copies of the same photograph, each clipped to one half.
        // Left: interior world (room, painting, curtains) — enters from left.
        // Right: exterior world (window, city, Caribbean light) — enters from right.
        // Interior has a 0.3s head start — the fantasy always arrives first.
        // A 1px seam marks the threshold at 50%, then dissolves.
        // Title block gradient fades in at 2.5s, just before typography sequence:
        //   Eyebrow (2.8s) → City rise from y:14 (3.1s) → Sub whisper (3.7s)
        //
        // Decode guard: Promise.all([imgLeft.decode(), imgRight.decode()])
        // prevents the black-flash that occurs when the browser composites
        // a GPU layer mid-animation before the image is fully decoded.
        // ----------------------------------------------------------

        if (sdHeroImgLeft && sdHeroImgRight && sdHeroSeam && sdHeroTitleBlock && sdHeroEyebrow && sdHeroCity && sdHeroSub) {

          gsap.set(sdHeroImgLeft,  { opacity: 0, x: -110 });
          gsap.set(sdHeroImgRight, { opacity: 0, x:  110 });
          gsap.set(sdHeroSeam,     { opacity: 0 });
          /* sdHeroTitleBlock, sdHeroEyebrow, sdHeroCity, sdHeroSub start at opacity:0 via CSS */

          Promise.all([
            sdHeroImgLeft.decode  ? sdHeroImgLeft.decode()  : Promise.resolve(),
            sdHeroImgRight.decode ? sdHeroImgRight.decode() : Promise.resolve()
          ]).catch(function () {}).then(function () {

            /* Force a synchronous layout flush before GSAP starts.
               Reading offsetWidth causes the browser to composite both
               images into the document before any animation begins —
               preventing the black GPU layer that appears when a layer
               is promoted before its image data is ready. */
            void sdHeroImgLeft.offsetWidth;
            void sdHeroImgRight.offsetWidth;

            var tl = gsap.timeline({
              delay: 0.2,
              onComplete: function() {
                sdHeroComplete = true;
                if (sdPendingGridReveal) sdPendingGridReveal();
              }
            });

            /* Phase 1 — Interior arrives first (0s → 2.0s)
               The fantasy has a slight head start. The room, the painting —
               the version of the place prepared for you. */
            tl.to(sdHeroImgLeft, {
              duration: 2.0,
              x: 0,
              opacity: 1,
              ease: 'power2.out'
            }, 0)

            /* Phase 2 — Exterior arrives, slightly behind (0.3s → 2.3s)
               Reality is a beat late. It always is. */
            .to(sdHeroImgRight, {
              duration: 2.0,
              x: 0,
              opacity: 1,
              ease: 'power2.out'
            }, 0.3)

            /* Phase 3 — Seam appears at the threshold (0.9s → 1.4s)
               The window frame made abstract — the threshold between worlds. */
            .to(sdHeroSeam, {
              duration: 0.5,
              opacity: 1,
              ease: 'power1.out'
            }, 0.9)

            /* Phase 4 — Seam dissolves (2.1s → 3.0s)
               The photograph is one. The seam burns off. */
            .to(sdHeroSeam, {
              duration: 0.9,
              opacity: 0,
              ease: 'power2.in'
            }, 2.1)

            /* Phase 5a — Gradient lift fades in (2.5s → 3.0s)
               Prepares the reading field before text arrives.
               The assembled photograph reads clean before the gradient builds. */
            .to(sdHeroTitleBlock, {
              duration: 0.5,
              opacity: 1,
              ease: 'power1.out'
            }, 2.5)

            /* Phase 5b — Eyebrow fades first (2.8s → 3.4s)
               The country, quietly stating itself. */
            .to(sdHeroEyebrow, {
              duration: 0.6,
              opacity: 1,
              ease: 'power1.out'
            }, 2.8)

            /* Phase 5c — City title rises from y:14 (3.1s → 4.0s)
               Materializes from the gradient, not stamped on.
               Playfair 900 italic: the stones arrive complete. */
            .fromTo(sdHeroCity,
              { opacity: 0, y: 14 },
              { opacity: 1, y: 0, duration: 0.9, ease: 'power2.out' },
              3.1
            )

            /* Phase 5d — Sub whispers in last (3.7s → 4.5s)
               Lora italic, barely audible. */
            .to(sdHeroSub, {
              duration: 0.8,
              opacity: 1,
              ease: 'power1.out'
            }, 3.7)


          }); // end Promise.all decode

        }

      } else {
        /* Reduced motion: show both halves and all text immediately */
        if (sdHeroImgLeft)    { gsap.set(sdHeroImgLeft,    { opacity: 1, x: 0 }); }
        if (sdHeroImgRight)   { gsap.set(sdHeroImgRight,   { opacity: 1, x: 0 }); }
        if (sdHeroTitleBlock) { gsap.set(sdHeroTitleBlock, { opacity: 1 }); }
        if (sdHeroEyebrow)    { gsap.set(sdHeroEyebrow,    { opacity: 1 }); }
        if (sdHeroCity)       { gsap.set(sdHeroCity,       { opacity: 1, y: 0 }); }
        if (sdHeroSub)        { gsap.set(sdHeroSub,        { opacity: 1 }); }
        /* Signal hero complete immediately for three-act coordination */
        sdHeroComplete = true;
        if (sdPendingGridReveal) sdPendingGridReveal();
      }


      // ----------------------------------------------------------
      // GRID IMAGE REVEAL — "The Rain Curtain"
      //
      // clip-path: inset(0 0 100% 0) → inset(0 0 0% 0)
      // Top-down wipe — sky clears first, then the street appears below.
      // The direction of tropical rain stopping.
      //
      // Simultaneous: filter: blur(2px) → blur(0) dissipates as
      // the curtain lifts. Two separate gsap.to() calls avoid
      // property-conflict compositing issues with clip-path.
      //
      // Duration: 1.4s. Ease: power2.out — wipe accelerates
      // as the rain clears, then settles.
      //
      // Per-item IntersectionObserver with closure-scoped triggered
      // boolean. threshold: 0.08 (mobile) — fires early so wipe reads as
      // arriving from just offscreen, not jumping in mid-view.
      // One-shot: unobserve + triggered guard prevents re-fire on
      // scroll back. Image-load guard: observe only after layout settled.
      // ----------------------------------------------------------

      if (!sdReducedMotion) {
        var sdGridItems = document.querySelectorAll('.fl718-sd-item');
        var sdGridItemsArr = Array.prototype.slice.call(sdGridItems);

        if (sdGridItemsArr.length > 0) {

          function sdRevealRainCurtain(img) {
            // Clip-path wipe: top-down clear (sky first, then street).
            // Starting state set in CSS: inset(0 0 100% 0).
            // filter: blur(2px) → blur(0) dissipates concurrent with the wipe.
            // clipPath and filter are distinct CSS properties — safe in one tween.
            gsap.to(img, {
              clipPath: 'inset(0 0 0% 0)',
              filter: 'blur(0px)',
              duration: 1.4,
              ease: 'power2.out'
            });
          }

          // ── THREE-ACT COORDINATION (MOBILE) ──────────────────────
          // On mobile (1-column), the first grid items may be within the
          // viewport during the hero animation. We split items into two
          // groups: in-viewport items (revealed immediately when hero
          // completes) and below-fold items (registered with IO after).
          // This prevents the Rain Curtain from firing during the hero
          // animation, which would compete visually and lose impact.
          // ----------------------------------------------------------

          var sdImageObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
              // Height guard: prevent 0-height collapsed items from triggering
              if (entry.isIntersecting && entry.boundingClientRect.height >= 10) {
                sdImageObserver.unobserve(entry.target);
                var img = entry.target.querySelector('img');
                if (img) sdRevealRainCurtain(img);
              }
            });
          }, { threshold: 0.08 });

          function sdRevealGrid() {
            var vph = window.innerHeight;
            var inView = [];
            var belowFold = [];

            sdGridItemsArr.forEach(function(item) {
              var rect = item.getBoundingClientRect();
              if (rect.height >= 10 && rect.top < vph) {
                inView.push(item);
              } else {
                belowFold.push(item);
              }
            });

            // Reveal in-viewport items immediately with stagger
            inView.forEach(function(item, i) {
              var img = item.querySelector('img');
              if (img) {
                gsap.delayedCall(i * 0.12, function() {
                  sdRevealRainCurtain(img);
                });
              }
            });

            // Register below-fold items with observer after one rAF
            requestAnimationFrame(function() {
              belowFold.forEach(function(item) {
                sdImageObserver.observe(item);
              });
            });
          }

          // Wire up the three-act handoff
          sdPendingGridReveal = sdRevealGrid;

          // If hero already finished (reduced motion snapped it, or
          // failsafe fired before this code ran), fire immediately
          if (sdHeroComplete) sdRevealGrid();

        }

      } else {
        /* Reduced motion: CSS handles this via @media — clip-path: none,
           filter: none already applied. No JS needed. */
      }


      // ----------------------------------------------------------
      // HOVER EFFECT — "The Window Frame"
      //
      // The radial vignette gradient is baked into CSS on .fl718-sd-item__veil.
      // GSAP tweens opacity only — the gradient shape doesn't change.
      //
      // On enter: opacity 0 → 1, 0.5s, power2.out. The frame closes in.
      // On leave: opacity 1 → 0, 0.65s, power2.inOut. Steps back gently.
      //
      // Touch guard: sdHoverCapable prevents hover firing on tap devices.
      // killTweensOf on each event prevents interrupted tween conflicts.
      // ----------------------------------------------------------

      if (!sdReducedMotion && sdHoverCapable) {
        var sdHoverItems = Array.prototype.slice.call(document.querySelectorAll('.fl718-sd-item'));
        sdHoverItems.forEach(function(item) {
          var veil = item.querySelector('.fl718-sd-item__veil');
          if (!veil) return;

          item.addEventListener('mouseenter', function() {
            gsap.killTweensOf(veil);
            gsap.to(veil, {
              opacity: 1,
              duration: 0.5,
              ease: 'power2.out'
            });
          });

          item.addEventListener('mouseleave', function() {
            gsap.killTweensOf(veil);
            gsap.to(veil, {
              opacity: 0,
              duration: 0.65,
              ease: 'power2.inOut'
            });
          });
        });
      }


      // ----------------------------------------------------------
      // LIGHTBOX — "The Glass Pane"
      //
      // The lightbox is the page's interior/exterior threshold played
      // back at the micro scale. When you click a photograph to view it
      // full-screen, you are looking through another window.
      //
      // OPEN (~1.45s):
      //   1. Nine horizontal venetian strips seal downward, top→bottom,
      //      scaleY 0→1 from transform-origin: top center. Stagger 0.04s,
      //      duration 0.22s per strip, ease power2.inOut. The warm dark
      //      field materializes strip by strip — rain shutters closing.
      //   2. Photograph slides in from the right (x: +80 → 0, opacity
      //      0 → 1, 0.5s, power2.out) — print being placed in a frame.
      //   3. UI fades in last (0.25s).
      //
      // CLOSE (reverse gravity):
      //   1. UI fades out (0.2s).
      //   2. Photo slides right (x: 0 → +80, opacity 1 → 0, 0.4s, power2.in).
      //   3. Strips peel open bottom→top (transform-origin: bottom center,
      //      scaleY 1 → 0, stagger from 'end'). Light returns the same way
      //      it left.
      //
      // NAV (prev/next): current photo exits one direction, new photo
      // enters from the opposite side. UI dims to 0.4 during the swap.
      //
      // SAFARI: no clip-path + GSAP filter on the photo. Strips use
      // scaleY only; photo wrap uses x + opacity only.
      // ----------------------------------------------------------

      var sdLbPhotos        = Array.prototype.slice.call(document.querySelectorAll('.fl718-sd-item'));
      var sdLbRootEl        = document.getElementById('sdLbRoot');
      var sdLbDarkEl        = document.getElementById('sdLbDark');
      var sdLbStageEl       = document.getElementById('sdLbStage');
      var sdLbUiEl          = document.getElementById('sdLbUi');
      var sdLbImageWrapEl   = document.getElementById('sdLbImageWrap');
      var sdLbImageEl       = document.getElementById('sdLbImage');
      var sdLbCounterEl     = document.getElementById('sdLbCounter');
      var sdLbCloseEl       = document.getElementById('sdLbClose');
      var sdLbPrevEl        = document.getElementById('sdLbPrev');
      var sdLbNextEl        = document.getElementById('sdLbNext');
      var sdLbBackdropEl    = document.getElementById('sdLbBackdrop');

      // Glass Pane configuration
      var SD_LB_STRIP_COUNT    = 9;
      var SD_LB_STRIP_DURATION = 0.22;   // per strip
      var SD_LB_STRIP_STAGGER  = 0.04;   // between strips
      var SD_LB_STRIP_COLOR    = 'rgba(14, 10, 6, 0.97)';
      var SD_LB_PHOTO_X_OFFSET = 80;     // px slide distance
      var SD_LB_PHOTO_IN_DUR   = 0.50;
      var SD_LB_PHOTO_OUT_DUR  = 0.40;
      var SD_LB_PHOTO_NAV_OUT  = 0.30;
      var SD_LB_PHOTO_NAV_IN   = 0.35;
      var SD_LB_UI_IN_DUR      = 0.25;
      var SD_LB_UI_OUT_DUR     = 0.20;

      var sdLbStrips = [];

      if (sdLbRootEl && sdLbDarkEl && sdLbStageEl && sdLbUiEl && sdLbImageWrapEl && sdLbImageEl) {

        // ── Build venetian strips inside the dark layer ─────────
        // Each strip is a horizontal band positioned by inline top/height.
        // Color is set inline so the strip color stays in sync with the
        // SD_LB_STRIP_COLOR constant above (and the CSS background is the
        // same value as a no-JS safety net).
        (function sdLbBuildStrips() {
          var stepPct = 100 / SD_LB_STRIP_COUNT;
          for (var i = 0; i < SD_LB_STRIP_COUNT; i++) {
            var s = document.createElement('div');
            s.className = 'fl718-sd-lb-strip';
            s.setAttribute('aria-hidden', 'true');
            s.style.height = stepPct.toFixed(4) + '%';
            s.style.top    = (i * stepPct).toFixed(4) + '%';
            s.style.background = SD_LB_STRIP_COLOR;
            sdLbDarkEl.appendChild(s);
            sdLbStrips.push(s);
          }
        })();

        // Initial state — wrap and dark hidden
        gsap.set(sdLbImageWrapEl, { opacity: 0, x: 0 });
        gsap.set(sdLbDarkEl, { opacity: 0 });


        var sdLbIsOpen      = false;
        var sdLbIsAnimating = false;
        var sdLbCurrentIdx  = 0;
        var sdLbTotal       = sdLbPhotos.length;
        var sdLbLastFocus   = null;
        var sdLbTouchStart  = null;
        var sdLbScrollY     = 0; // iOS scroll lock: records scroll position

        function sdLbGetData(idx) {
          var fig = sdLbPhotos[idx];
          var img = fig.querySelector('img');
          return {
            src: img ? (img.getAttribute('src') || '') : '',
            alt: img ? (img.getAttribute('alt') || '') : ''
          };
        }

        function sdLbUpdateUi(idx) {
          if (sdLbCounterEl) sdLbCounterEl.textContent = (idx + 1) + ' / ' + sdLbTotal;
        }

        function sdLbMakeReachable(yes) {
          var t = yes ? '0' : '-1';
          if (sdLbCloseEl) sdLbCloseEl.setAttribute('tabindex', t);
          if (sdLbPrevEl)  sdLbPrevEl.setAttribute('tabindex', t);
          if (sdLbNextEl)  sdLbNextEl.setAttribute('tabindex', t);
        }

        // OPEN — Glass Pane sequence
        function sdLbOpenLb(fig) {
          if (sdLbIsOpen || sdLbIsAnimating) return;
          sdLbIsAnimating = true;
          sdLbLastFocus   = fig;
          sdLbCurrentIdx  = parseInt(fig.getAttribute('data-index'), 10);

          var data = sdLbGetData(sdLbCurrentIdx);
          sdLbImageEl.src = data.src;
          sdLbImageEl.alt = data.alt;
          sdLbUpdateUi(sdLbCurrentIdx);

          sdLbDarkEl.classList.add('fl718-sd-lb-dark--active');
          sdLbStageEl.classList.add('fl718-sd-lb-stage--active');
          sdLbUiEl.classList.add('fl718-sd-lb-ui--active');
          sdLbRootEl.removeAttribute('aria-hidden');
          sdLbMakeReachable(true);
          // iOS Safari scroll lock — position:fixed pattern.
          // overflow:hidden is silently ignored by iOS Safari.
          sdLbScrollY = window.scrollY;
          document.body.style.position = 'fixed';
          document.body.style.top = '-' + sdLbScrollY + 'px';
          document.body.style.width = '100%';

          if (sdReducedMotion) {
            // Snap straight to the open state — strips solid, photo placed, UI on.
            gsap.set(sdLbStrips, { scaleY: 1 });
            gsap.set(sdLbDarkEl, { opacity: 1 });
            gsap.set(sdLbImageWrapEl, { opacity: 1, x: 0 });
            gsap.set(sdLbUiEl, { opacity: 1 });
            sdLbIsOpen = true;
            sdLbIsAnimating = false;
            if (sdLbCloseEl) sdLbCloseEl.focus();
            return;
          }

          // Reset state for the open sequence
          gsap.set(sdLbStrips, { scaleY: 0, transformOrigin: 'top center' });
          gsap.set(sdLbDarkEl, { opacity: 1 });   // dark layer is the strip stage; visible
          gsap.set(sdLbImageWrapEl, { opacity: 0, x: SD_LB_PHOTO_X_OFFSET });
          gsap.set(sdLbUiEl, { opacity: 0 });

          var tl = gsap.timeline({
            onComplete: function() {
              sdLbIsOpen = true;
              sdLbIsAnimating = false;
              if (sdLbCloseEl) sdLbCloseEl.focus();
            }
          });

          // Phase 1 — Strips seal downward (rain shutters closing)
          tl.to(sdLbStrips, {
            scaleY: 1,
            duration: SD_LB_STRIP_DURATION,
            ease: 'power2.inOut',
            stagger: { each: SD_LB_STRIP_STAGGER, from: 'start' }
          }, 0);

          // Phase 2 — Photograph slides in from the right (placed in the frame)
          tl.to(sdLbImageWrapEl, {
            x: 0,
            opacity: 1,
            duration: SD_LB_PHOTO_IN_DUR,
            ease: 'power2.out'
          }, '>');

          // Phase 3 — UI fades in last
          tl.to(sdLbUiEl, {
            opacity: 1,
            duration: SD_LB_UI_IN_DUR,
            ease: 'power1.out'
          }, '>');
        }

        // CLOSE — Glass Pane reverse
        function sdLbCloseLb() {
          if (!sdLbIsOpen || sdLbIsAnimating) return;
          sdLbIsAnimating = true;
          sdLbIsOpen = false;
          sdLbMakeReachable(false);

          if (sdReducedMotion) {
            // Snap to closed
            gsap.set(sdLbStrips, { scaleY: 0 });
            gsap.set(sdLbDarkEl, { opacity: 0 });
            gsap.set(sdLbImageWrapEl, { opacity: 0, x: 0 });
            gsap.set(sdLbUiEl, { opacity: 0 });
            sdLbReset();
            return;
          }

          var tl = gsap.timeline({ onComplete: sdLbReset });

          // Phase 1 — UI fades out
          tl.to(sdLbUiEl, {
            opacity: 0,
            duration: SD_LB_UI_OUT_DUR,
            ease: 'power1.in'
          }, 0);

          // Phase 2 — Photo slides out to the right (out the window)
          tl.to(sdLbImageWrapEl, {
            x: SD_LB_PHOTO_X_OFFSET,
            opacity: 0,
            duration: SD_LB_PHOTO_OUT_DUR,
            ease: 'power2.in'
          }, '>');

          // Phase 3 — Strips peel open bottom→top (light returns)
          // transformOrigin flips here so the scaleY:0 collapses upward
          // toward the bottom edge — reading as "lifting" rather than "closing".
          // Cleanup of dark opacity, transformOrigin cache, and ARIA state
          // happens in sdLbReset (timeline onComplete) — single source of truth.
          tl.to(sdLbStrips, {
            scaleY: 0,
            transformOrigin: 'bottom center',
            duration: SD_LB_STRIP_DURATION * 1.1,
            ease: 'power2.inOut',
            stagger: { each: SD_LB_STRIP_STAGGER, from: 'end' }
          }, '>');
        }

        function sdLbReset() {
          sdLbDarkEl.classList.remove('fl718-sd-lb-dark--active');
          sdLbStageEl.classList.remove('fl718-sd-lb-stage--active');
          sdLbUiEl.classList.remove('fl718-sd-lb-ui--active');
          sdLbRootEl.setAttribute('aria-hidden', 'true');
          // Reset all Glass Pane properties to their initial states.
          gsap.set(sdLbDarkEl, { opacity: 0 });
          // CRITICAL: clearProps on transformOrigin first, then re-set.
          // The close phase tweens transformOrigin to 'bottom center' so the
          // strips peel upward. Without flushing GSAP's internal transform
          // cache, a second open would scale strips from the bottom edge,
          // breaking the "rain shutters closing downward" reading. Two-step
          // reset (clearProps then set) forces a clean origin re-establish.
          gsap.set(sdLbStrips, { clearProps: 'transformOrigin' });
          gsap.set(sdLbStrips, { scaleY: 0, transformOrigin: 'top center' });
          gsap.set(sdLbImageWrapEl, { opacity: 0, x: 0 });
          gsap.set(sdLbUiEl, { opacity: 0 });
          sdLbImageEl.removeAttribute('src');
          sdLbImageEl.alt = '';
          // iOS Safari scroll lock — restore position + scroll
          document.body.style.position = '';
          document.body.style.top = '';
          document.body.style.width = '';
          window.scrollTo(0, sdLbScrollY);
          sdLbIsAnimating = false;
          /* Reset any veil left at opacity:1 — user may have hovered a figure
             then opened the lightbox without moving the cursor off it first.
             The mouseleave never fires in that case, so we reset all veils here. */
          if (sdHoverCapable && !sdReducedMotion) {
            Array.prototype.slice.call(document.querySelectorAll('.fl718-sd-item__veil')).forEach(function(v) {
              gsap.killTweensOf(v);
              gsap.set(v, { opacity: 0 });
            });
          }
          if (sdLbLastFocus) sdLbLastFocus.focus();
        }

        // NAVIGATE — Glass Pane horizontal slide (current exits one direction,
        // new arrives from the opposite). Wrap-around enabled (modulo).
        // direction is computed from the index delta: +1 = next (current
        // exits left, new enters from right), -1 = prev (mirror).
        function sdLbNavigate(newIdx) {
          if (!sdLbIsOpen || sdLbIsAnimating) return;
          sdLbIsAnimating = true;
          newIdx = ((newIdx % sdLbTotal) + sdLbTotal) % sdLbTotal;

          // Compute travel direction. Handle wrap edges naturally:
          // last → first reads as "next", first → last reads as "prev".
          var direction;
          if (newIdx === 0 && sdLbCurrentIdx === sdLbTotal - 1) {
            direction = +1;
          } else if (newIdx === sdLbTotal - 1 && sdLbCurrentIdx === 0) {
            direction = -1;
          } else {
            direction = (newIdx > sdLbCurrentIdx) ? +1 : -1;
          }

          var exitX  = direction > 0 ? -SD_LB_PHOTO_X_OFFSET :  SD_LB_PHOTO_X_OFFSET;
          var enterX = direction > 0 ?  SD_LB_PHOTO_X_OFFSET : -SD_LB_PHOTO_X_OFFSET;

          sdLbCurrentIdx = newIdx;
          var data = sdLbGetData(newIdx);
          sdLbUpdateUi(newIdx);

          if (sdReducedMotion) {
            sdLbImageEl.src = data.src;
            sdLbImageEl.alt = data.alt;
            gsap.set(sdLbImageWrapEl, { opacity: 1, x: 0 });
            sdLbIsAnimating = false;
            return;
          }

          // Brief UI dim during the swap.
          // killTweensOf first — consistent with the hover-veil and other
          // free-standing gsap.to patterns in this file.
          gsap.killTweensOf(sdLbUiEl);
          gsap.to(sdLbUiEl, { opacity: 0.4, duration: 0.15, ease: 'power1.in' });

          // Exit current photo
          gsap.to(sdLbImageWrapEl, {
            x: exitX,
            opacity: 0,
            duration: SD_LB_PHOTO_NAV_OUT,
            ease: 'power2.in',
            onComplete: function() {
              // Swap src
              sdLbImageEl.src = data.src;
              sdLbImageEl.alt = data.alt;

              // Position new photo off-screen on the entering side
              gsap.set(sdLbImageWrapEl, { x: enterX, opacity: 0 });

              // Enter new photo
              gsap.to(sdLbImageWrapEl, {
                x: 0,
                opacity: 1,
                duration: SD_LB_PHOTO_NAV_IN,
                ease: 'power2.out',
                onComplete: function() {
                  // Restore UI
                  gsap.killTweensOf(sdLbUiEl);
                  gsap.to(sdLbUiEl, { opacity: 1, duration: 0.2, ease: 'power1.out' });
                  sdLbIsAnimating = false;
                }
              });
            }
          });
        }

        // Make grid figures clickable
        sdLbPhotos.forEach(function(fig) {
          fig.setAttribute('tabindex', '0');
          fig.setAttribute('role', 'button');
          var imgEl = fig.querySelector('img');
          fig.setAttribute('aria-label', 'Open: ' + (imgEl ? imgEl.getAttribute('alt') : 'photograph'));
          fig.addEventListener('click', function() { sdLbOpenLb(fig); });
          fig.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              sdLbOpenLb(fig);
            }
          });
        });

        // Controls
        if (sdLbCloseEl)     sdLbCloseEl.addEventListener('click', sdLbCloseLb);
        if (sdLbPrevEl)      sdLbPrevEl.addEventListener('click', function() { sdLbNavigate(sdLbCurrentIdx - 1); });
        if (sdLbNextEl)      sdLbNextEl.addEventListener('click', function() { sdLbNavigate(sdLbCurrentIdx + 1); });
        if (sdLbBackdropEl)  sdLbBackdropEl.addEventListener('click', sdLbCloseLb);

        // Keyboard — Escape, Arrow nav, Tab focus trap
        document.addEventListener('keydown', function(e) {
          if (!sdLbIsOpen) return;
          if (e.key === 'Escape')     { sdLbCloseLb(); return; }
          if (e.key === 'ArrowLeft')  { sdLbNavigate(sdLbCurrentIdx - 1); return; }
          if (e.key === 'ArrowRight') { sdLbNavigate(sdLbCurrentIdx + 1); return; }
          if (e.key === 'Tab') {
            var focusable = [sdLbCloseEl, sdLbPrevEl, sdLbNextEl].filter(function(el) { return el; });
            if (!focusable.length) return;
            var first = focusable[0];
            var last  = focusable[focusable.length - 1];
            if (e.shiftKey) {
              if (document.activeElement === first) { e.preventDefault(); last.focus(); }
            } else {
              if (document.activeElement === last)  { e.preventDefault(); first.focus(); }
            }
          }
        });

        // Touch swipe
        sdLbStageEl.addEventListener('touchstart', function(e) {
          sdLbTouchStart = e.touches[0].clientX;
        }, { passive: true });
        sdLbStageEl.addEventListener('touchend', function(e) {
          if (sdLbTouchStart === null) return;
          var dx = e.changedTouches[0].clientX - sdLbTouchStart;
          sdLbTouchStart = null;
          if (Math.abs(dx) < 50) return;
          sdLbNavigate(sdLbCurrentIdx + (dx < 0 ? 1 : -1));
        }, { passive: true });

      } // end lightbox guard

    })();
  </script>

  <!-- Wipe bar — fixed full-viewport overlay for Static Burst link-out transition.
       Sits outside all scroll containers; z-index 9999 clears everything. -->
  <div class="fl718-sd-wipe-bar" id="sdWipeBar" aria-hidden="true"></div>

</body>
